  </head>
  <body>

      <div class="container topbar-inner">

    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
              <rect x="18" y="18" width="84" height="84" rx="22" fill="currentColor"/>
              <rect x="34" y="30" width="52" height="72" rx="12" fill="white" opacity="0.12"/>
              <path d="M38 41.5C38 31.5 46.5 23 56.5 23H63.5C73.5 23 82 31.5 82 41.5V58C82 67.4 74.4 75 65 75H55C45.6 75 38 67.4 38 58V41.5Z" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M55 56.4C55 50.8 59.5 46.4 65 46.4C70.5 46.4 75 50.8 75 56.4V59H69.6V56.4C69.6 54.3 68 52.7 65.9 52.7C63.8 52.7 62.2 54.3 62.2 56.4V59H55V56.4Z" fill="white"/>

              <circle cx="86" cy="30" r="7" fill="#ffb067"/>
            </svg>

        <nav class="main-nav">
          <a href="index.html">Início</a>
          <a href="index.html#catalogo">Loja</a>
          <a href="index.html#catalogo">Smartphones</a>
          <a href="index.html#contato">Contato</a>

        <a href="carrinho.html" class="cart-button"><span>🛒</span><span>Carrinho</span><span class="cart-count" data-cart-count>0</span></a>
      </div>
    </header>

    <main class="checkout-page">
      <div class="container checkout-shell">
        <form id="checkoutForm" class="checkout-form">
          <div class="checkout-step">
            <h3>ETAPA 1 — DADOS DO CLIENTE</h3>
            <div class="grid two-cols">
              <label>Nome completo<input type="text" name="customerName" required /></label>
              <label>Telefone<input type="tel" name="phone" required /></label>
              <label class="full">E-mail<input type="email" name="email" required /></label>
            </div>
          </div>

          <div class="checkout-step">
            <h3>ETAPA 2 — ENDEREÇO</h3>
            <div class="grid two-cols">
              <label>CEP<input type="text" name="cep" required /></label>
              <label>Rua<input type="text" name="street" required /></label>
              <label>Número<input type="text" name="number" required /></label>
              <label>Complemento<input type="text" name="complement" /></label>
              <label>Bairro<input type="text" name="district" required /></label>
              <label>Cidade<input type="text" name="city" required /></label>
              <label>Estado<input type="text" name="state" required /></label>
            </div>
          </div>

          <div class="checkout-step">
            <h3>ETAPA 3 — PAGAMENTO</h3>
            <div class="payment-options">
              <label><input type="radio" name="paymentMethod" value="PIX" checked /> PIX</label>
              <label><input type="radio" name="paymentMethod" value="Cartão de crédito" /> Cartão de crédito</label>
              <label><input type="radio" name="paymentMethod" value="Cartão de débito" /> Cartão de débito</label>
              <label><input type="radio" name="paymentMethod" value="Outras formas configuráveis" /> Outras formas configuráveis</label>
            </div>
          </div>

          <div class="checkout-step">
            <h3>ETAPA 4 — REVISÃO</h3>
            <div id="checkoutReview"></div>
          </div>

          <div class="checkout-step">
            <h3>ETAPA 5</h3>
            <label class="full">Observações<textarea name="notes" rows="4" placeholder="Observações do pedido"></textarea></label>
            <button type="submit" class="button primary full-width">ENVIAR PEDIDO PELO WHATSAPP</button>
          </div>
        </form>
      </div>
    </main>

    <a class="floating-whatsapp" href="https://wa.me/5583986882292" target="_blank" rel="noreferrer">💬 FALE CONOSCO</a>
  </body>
</html>
